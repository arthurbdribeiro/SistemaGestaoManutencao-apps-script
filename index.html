<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    :root {
      --bg-color: #f4f7f6;
      --text-color: #333333;
      --card-bg: #ffffff;
      --primary: #0056b3;
      --primary-hover: #004494;
      --success: #28a745;
      --success-hover: #218838;
      --border: #dddddd;
    }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-color); 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
    }
    
    .container { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 600px; 
      padding: 30px; 
      border-radius: 8px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
    }
    
    h2 { text-align: center; margin-top: 0; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input, textarea { 
      width: 100%; 
      padding: 10px; 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    input:focus, textarea:focus { border-color: var(--primary); outline: none; }
    
    button { 
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px; 
      cursor: pointer; 
      color: white; 
      margin-bottom: 10px; 
      transition: background-color 0.3s;
    }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-voltar { 
      display: block; 
      text-align: center; 
      color: var(--primary); 
      text-decoration: none; 
      cursor: pointer; 
      font-size: 14px; 
      margin-top: 5px; 
    }
    .btn-voltar:hover { text-decoration: underline; }
    
    .tela { display: none; }
    .tela.ativa { display: block; }
    
    .chamado-card { 
      border: 1px solid var(--border); 
      padding: 15px; 
      border-radius: 4px; 
      margin-bottom: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .chamado-info { font-size: 14px; }

    /* ========================================== */
    /* TOAST NOTIFICATION (Aviso Profissional)    */
    /* ========================================== */
    #toast-notificacao {
      visibility: hidden;
      min-width: 250px;
      background-color: var(--success);
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 16px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
      font-size: 15px;
      font-weight: bold;
    }

    #toast-notificacao.mostrar {
      visibility: visible;
      animation: fadein 0.5s, fadeout 0.5s 3.5s;
    }

    #toast-notificacao.erro {
      background-color: #d9534f; /* Vermelho para erros */
    }

    @keyframes fadein {
      from {bottom: 0; opacity: 0;}
      to {bottom: 30px; opacity: 1;}
    }

    @keyframes fadeout {
      from {bottom: 30px; opacity: 1;}
      to {bottom: 0; opacity: 0;}
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ========================================== -->
    <!-- TELA 1: PAINEL PRINCIPAL                   -->
    <!-- ========================================== -->
    <div id="tela-painel" class="tela ativa">
      <h2>Sistema de Gestão de Manutenção</h2>
      
      <button class="btn-primary" onclick="mudarTela('tela-abertura')">+ Registrar Chamado</button>
      
      <div id="lista-chamados" style="margin-top: 20px;"></div>
      
      <span class="btn-voltar" onclick="abrirHistorico()" style="margin-top: 20px; font-weight: bold; color: #666;">Histórico de Chamados Resolvidos</span>
      
    </div>

    <!-- ========================================== -->
    <!-- TELA 2: FORMULÁRIO DE ABERTURA             -->
    <!-- ========================================== -->
    <div id="tela-abertura" class="tela">
      <h2>Registrar Chamado</h2>
      
      <form id="form-abertura" onsubmit="event.preventDefault(); enviarDadosAbertura();">
        
        <div class="form-group">
          <label>Solicitante (Quem relatou?)</label>
          <input type="text" id="campo-solicitante" placeholder="Ex: Nome - Cargo" required>
        </div>
        
        <div class="form-group">
          <label>Equipamento / Modelo</label>
          <input type="text" id="campo-equipamento" placeholder="Ex: Câmera Sony" required>
        </div>
        
        <div class="form-group">
          <label>Local / Setor</label>
          <input type="text" id="campo-local" placeholder="Ex: Jornalismo Bauru" required>
        </div>
        
        <div class="form-group">
          <label>Defeito Relatado</label>
          <textarea id="campo-defeito" rows="3" placeholder="O que está acontecendo?" required></textarea>
        </div>
        
        <button type="submit" class="btn-primary">Abrir Chamado</button>
        <span class="btn-voltar" onclick="mudarTela('tela-painel')">Cancelar e Voltar</span>
      </form>
    </div>

    <!-- ========================================== -->
    <!-- TELA 3: FORMULÁRIO DE RESOLUÇÃO            -->
    <!-- ========================================== -->
    <div id="tela-resolucao" class="tela">
      <h2>Resolver Chamado</h2>
      
      <form id="form-resolucao" onsubmit="event.preventDefault(); enviarDadosResolucao();">
        
        <input type="hidden" id="id-chamado-resolver">
        
        <div class="form-group">
          <label>Solução Aplicada</label>
          <textarea id="campo-solucao" rows="4" placeholder="Descreva o que foi feito para consertar o equipamento..." required></textarea>
        </div>
        
        <button type="submit" class="btn-success">Finalizar</button>
        <span class="btn-voltar" onclick="mudarTela('tela-painel')">Cancelar e Voltar</span>
      </form>
    </div>

    <!-- ========================================== -->
    <!-- TELA 4: HISTÓRICO DE RESOLVIDOS            -->
    <!-- ========================================== -->
    <div id="tela-historico" class="tela">
      <h2>Histórico de Manutenção</h2>
      
      <span class="btn-voltar" onclick="mudarTela('tela-painel')" style="margin-bottom: 20px; text-align: left;">← Voltar ao Painel</span>
      
      <div id="lista-historico"></div>
    </div>

  </div>

  <!-- Container da Notificação Flutuante -->
  <div id="toast-notificacao"></div>

  <script>
    // ==========================================
    // MOTOR FRONT-END (Controle da SPA)
    // ==========================================
    function mudarTela(idTelaDestino) {
      const telas = document.querySelectorAll('.tela');
      telas.forEach(tela => tela.classList.remove('ativa'));
      document.getElementById(idTelaDestino).classList.add('ativa');
    }

    function abrirResolucao(idChamado) {
      document.getElementById('id-chamado-resolver').value = idChamado;
      document.getElementById('campo-solucao').value = ''; 
      mudarTela('tela-resolucao');
    }

    // ==========================================
    // INTEGRAÇÃO COM O BACK-END (GAS)
    // ==========================================
    function enviarDadosAbertura() {
      const btnSalvar = document.querySelector('#form-abertura button[type="submit"]');
      const textoOriginal = btnSalvar.innerText;
      btnSalvar.innerText = "Salvando no sistema...";
      btnSalvar.disabled = true;

      const pacoteDados = {
        solicitante: document.getElementById('campo-solicitante').value,
        equipamento: document.getElementById('campo-equipamento').value,
        local:       document.getElementById('campo-local').value,
        defeito:     document.getElementById('campo-defeito').value
      };

      google.script.run
        .withSuccessHandler(function(resposta) {
          mostrarNotificacao("✅ Chamado aberto com sucesso!");
          document.getElementById('form-abertura').reset(); 
          btnSalvar.innerText = textoOriginal;              
          btnSalvar.disabled = false;
          
          mudarTela('tela-painel'); 
          carregarListaChamados();
        })
        .withFailureHandler(function(erro) {
          mostrarNotificacao("❌ Erro ao salvar: " + erro.message, 'erro');
          btnSalvar.innerText = textoOriginal;
          btnSalvar.disabled = false;
        })
        .salvarNovoChamado(pacoteDados); 
    }

    function enviarDadosResolucao() {
      // 1. Controle visual do botão
      const btnSalvar = document.querySelector('#form-resolucao button[type="submit"]');
      const textoOriginal = btnSalvar.innerText;
      btnSalvar.innerText = "Encerrando chamado...";
      btnSalvar.disabled = true;

      // 2. Empacota o ID (que estava invisível) e o texto da solução
      const pacoteDados = {
        id: document.getElementById('id-chamado-resolver').value,
        solucao: document.getElementById('campo-solucao').value
      };

      // 3. Envia para o Back-end
      google.script.run
        .withSuccessHandler(function(resposta) {
          mostrarNotificacao("✅ Chamado encerrado com sucesso!");
          
          document.getElementById('form-resolucao').reset(); 
          btnSalvar.innerText = textoOriginal;              
          btnSalvar.disabled = false;
          
          mudarTela('tela-painel'); 
          
          // Como a nossa função de Leitura só pega status 'Aberto', 
          // o chamado que acabamos de resolver vai sumir da tela instantaneamente!
          carregarListaChamados(); 
        })
        .withFailureHandler(function(erro) {
          mostrarNotificacao("❌ Erro ao encerrar: " + erro.message, 'erro');
          btnSalvar.innerText = textoOriginal;
          btnSalvar.disabled = false;
        })
        .resolverChamado(pacoteDados); 
    }

    // ==========================================
    // MOTOR DE CARREGAMENTO DO PAINEL (READ)
    // ==========================================
    function carregarListaChamados() {
      const divLista = document.getElementById('lista-chamados');
      divLista.innerHTML = "<p style='text-align:center;'>Buscando chamados na base de dados...</p>";
      
      google.script.run
        .withSuccessHandler(desenharCardsNaTela)
        .buscarChamadosAbertos();
    }

    function desenharCardsNaTela(chamados) {
      const divLista = document.getElementById('lista-chamados');
      divLista.innerHTML = ""; 
      
      if (chamados.length === 0) {
        divLista.innerHTML = "<p style='text-align:center; color:#28a745; font-weight:bold;'>Nenhum equipamento em manutenção no momento.</p>";
        return;
      }
      
      chamados.forEach(function(chamado) {
        let card = `
          <div class="chamado-card">
            <div class="chamado-info">
              <strong>${chamado.equipamento}</strong> <span style="color:#888; font-size:12px;">(${chamado.id})</span><br>
              ${chamado.local} - ${chamado.defeito}<br>
              <small style="color: #666;">Por: ${chamado.solicitante} em ${chamado.data}</small>
            </div>
            <button class="btn-success" style="width: auto; padding: 8px 15px; margin: 0;" onclick="abrirResolucao('${chamado.id}')">Resolver</button>
          </div>
        `;
        divLista.innerHTML += card;
      });
    }

    // ==========================================
    // MOTOR DE CARREGAMENTO DO HISTÓRICO
    // ==========================================
    
    function abrirHistorico() {
      mudarTela('tela-historico');
      
      const divHistorico = document.getElementById('lista-historico');
      divHistorico.innerHTML = "<p style='text-align:center;'>Buscando histórico de chamados...</p>";
      
      google.script.run
        .withSuccessHandler(desenharCardsHistorico)
        .buscarChamadosResolvidos();
    }

    function desenharCardsHistorico(chamados) {
      const divHistorico = document.getElementById('lista-historico');
      divHistorico.innerHTML = ""; 
      
      if (chamados.length === 0) {
        divHistorico.innerHTML = "<p style='text-align:center; color:#666;'>Não há histórico de chamados finalizados.</p>";
        return;
      }
      
      chamados.forEach(function(chamado) {
        let card = `
          <div class="chamado-card" style="flex-direction: column; align-items: flex-start; background-color: #f9f9f9;">
            <div class="chamado-info" style="width: 100%;">
              <strong>${chamado.equipamento}</strong> <span style="color:#888; font-size:12px;">(${chamado.id})</span><br>
              ${chamado.local} - <em style="color:#555;">${chamado.defeito}</em><br>
              
              <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
              
              <strong style="color: var(--success);">Solução:</strong> ${chamado.solucao}<br>
              
              <div style="margin-top: 10px; font-size: 11px; color: #777;">
                Relatado por: ${chamado.solicitante} em ${chamado.dataAbertura}<br>
                Resolvido por: ${chamado.tecnicoSolucionador} em ${chamado.dataResolucao}
              </div>
            </div>
          </div>
        `;
        divHistorico.innerHTML += card;
      });
    }

    // ==========================================
    // SISTEMA DE NOTIFICAÇÕES (Substitui o alert)
    // ==========================================
    function mostrarNotificacao(mensagem, tipo = 'sucesso') {
      const toast = document.getElementById('toast-notificacao');
      toast.innerText = mensagem;
      
      if (tipo === 'erro') {
        toast.classList.add('erro');
      } else {
        toast.classList.remove('erro');
      }
      
      toast.classList.add('mostrar');
      
      // Remove a classe após 4 segundos para esconder o aviso
      setTimeout(function() { 
        toast.classList.remove('mostrar'); 
      }, 4000);
    }

    window.onload = carregarListaChamados;
    
  </script>
</body>
</html>
